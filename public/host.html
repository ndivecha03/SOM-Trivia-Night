<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Night — HOST</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--accent:#f0c040;--accent2:#e05a5a;--text:#f0eee8;--muted:#7a7890;--border:#2a2a3a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);height:60px;flex-shrink:0}
.logo{font-family:"Bebas Neue",sans-serif;font-size:24px;color:var(--accent);letter-spacing:1px}
.status-bar{display:flex;align-items:center;gap:20px}
.conn{display:flex;align-items:center;gap:6px;font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn-dot.on{background:#4caf82;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sub-count{font-family:"Space Mono",monospace;font-size:12px;color:var(--accent);background:rgba(240,192,64,.1);padding:4px 10px;border-radius:6px}
.reset-btn{background:var(--surface2);border:1px solid var(--accent2);color:var(--accent2);padding:6px 12px;border-radius:8px;font-family:"DM Sans",sans-serif;font-size:12px;cursor:pointer;transition:all .2s}
.reset-btn:hover{background:var(--accent2);color:#fff}
.slide-container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden;transition:background .4s ease}
.slide{max-width:1000px;width:100%;text-align:center;animation:fadeIn .3s ease;position:relative;z-index:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-title{font-family:"Bebas Neue",sans-serif;font-size:clamp(36px,6vw,64px);line-height:1;margin-bottom:16px}
.slide-sub{font-family:"Space Mono",monospace;font-size:clamp(12px,2vw,16px);color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.slide-content{font-size:clamp(18px,3vw,28px);line-height:1.4;max-width:800px;margin:0 auto}
.slide-note{font-family:"Space Mono",monospace;font-size:12px;padding:8px 16px;border-radius:8px;display:inline-block;margin-top:16px}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;text-align:left}
.q-card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:16px}
.q-card .num{font-family:"Space Mono",monospace;font-size:12px;color:var(--accent);margin-bottom:6px}
.q-card .txt{font-size:18px;line-height:1.3}
.answers-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:24px;text-align:left}
.answer-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.answer-card .q{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);margin-bottom:6px}
.answer-card .a{font-size:20px;font-weight:600;color:#4caf82}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.ctrl-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:10px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.ctrl-btn:hover{background:var(--border);border-color:var(--muted)}
.ctrl-btn.primary{background:var(--accent);color:#0a0a0f;border-color:var(--accent);font-weight:600}
.ctrl-btn.primary:hover{background:#ffd060}
.ctrl-btn:disabled{opacity:.4;cursor:not-allowed}
.slide-indicator{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);min-width:60px;text-align:center}
.timer-display{font-family:"Bebas Neue",sans-serif;font-size:28px;color:var(--accent);min-width:50px;text-align:center}
.timer-display.urgent{color:var(--accent2);animation:pulse .5s infinite alternate}
.audio-btn{background:rgba(240,192,64,.15);border:1px solid var(--accent);color:var(--accent);display:none}
.audio-btn.visible{display:flex}
.theme-bap{background:linear-gradient(145deg,#ffffff 0%,#f8f4ed 100%);color:#1a1a1a}
.theme-bap .slide-title{color:#c41e3a}
.theme-bap .slide-sub{color:#5a5a5a}
.theme-bap .answer-card{background:#fff;border-color:#e0d5c5}
.theme-bap .answer-card .a{color:#c41e3a}
.theme-bap .q-card{background:rgba(0,0,0,.03);border-color:#d4c8b8}
.theme-ai{background:linear-gradient(145deg,#0a2e1f 0%,#051a12 100%);color:#e0e0e0}
.theme-ai .slide-title{color:#d4af37}
.theme-ai .slide-sub{color:#8fb89e}
.theme-ai .answer-card{background:#0f3a28;border-color:#1a5c3d}
.theme-ai .answer-card .a{color:#d4af37}
.theme-ai .q-card{background:rgba(255,255,255,.05);border-color:#1a5c3d}
.theme-wib{background:linear-gradient(145deg,#f3e5f5 0%,#e8d5f0 100%);color:#4a148c}
.theme-wib .slide-title{color:#6a1b9a}
.theme-wib .slide-sub{color:#7b1fa2}
.theme-wib .answer-card{background:#fff;border-color:#e1bee7}
.theme-wib .answer-card .a{color:#6a1b9a}
.theme-wib .q-card{background:rgba(0,0,0,.03);border-color:#d1c4e9}
#logoWatermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:450px;height:450px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:0.08;pointer-events:none;z-index:0;transition:background-image .3s ease,opacity .3s ease}
.theme-bap #logoWatermark{background-image:url('logos/bap-logo.png')}
.theme-ai #logoWatermark{background-image:url('logos/ai-bridge-logo.png');opacity:0.12}
.theme-wib #logoWatermark{background-image:url('logos/wib-logo.png')}
.slide-content,.slide-title,.slide-sub,.answers-grid,.q-grid,.slide-note{position:relative;z-index:1}
</style>
</head>
<body>
<header class="header">
  <div class="logo">📽 TRIVIA NIGHT — HOST</div>
  <div class="status-bar">
    <div class="conn"><div class="conn-dot" id="connDot"></div><span id="connText">CONNECTING</span></div>
    <div class="sub-count" id="subCount">Submitted (0)</div>
    <button class="reset-btn" onclick="Host.reset()">🗑 Reset Game</button>
  </div>
</header>
<main class="slide-container">
  <div id="logoWatermark"></div>
  <div class="slide" id="slideContent"></div>
</main>
<footer class="controls">
  <button class="ctrl-btn" id="prevBtn" onclick="Host.prev()">← Prev</button>
  <span class="slide-indicator" id="slideInd">1 / 1</span>
  <button class="ctrl-btn primary" id="nextBtn" onclick="Host.next()">Next ▶</button>
  <div class="timer-display" id="timerDisplay">--:--</div>
  <button class="ctrl-btn audio-btn" id="audioBtn1" onclick="Host.playAudio(1)">▶ Q1 Lyric</button>
  <button class="ctrl-btn audio-btn" id="audioBtn2" onclick="Host.playAudio(2)">▶ Q2 Song</button>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const CONFIG = {
  apiKey: "AIzaSyBh-j_SfJwfvGyc_XaGR6ZETUel0ZJwtpc",
  authDomain: "som-trivia-night.firebaseapp.com",
  databaseURL: "https://som-trivia-night-default-rtdb.firebaseio.com",
  projectId: "som-trivia-night",
  storageBucket: "som-trivia-night.firebasestorage.app",
  messagingSenderId: "443495114109",
  appId: "1:443495114109:web:6e813b82fbf284e7b89814"
};

const app = initializeApp(CONFIG);
const db = getDatabase(app);
const gameRef = ref(db, "trivia/game");
const responsesRef = ref(db, "trivia/responses");

const SLIDES = [
  { type: 'title', title: 'USF Trivia Night 2025', sub: 'Brought to you by WIB × AI Club × BAP' },
  { type: 'rules', title: 'THE RULES', items: ['01 Form teams of 3-5 people. One device per team.', '02 4 questions per round. Assign confidence 1, 3, 5, 7 — use each once per round.', '03 7 minutes per round. Timer starts automatically!', '04 No looking up answers. Scores revealed after each round.', '05 BONUS ROUND: 1-20 Confidence. Correct = +Pts, Wrong = -Pts.'] },
  { type: 'round-intro', round: '1', title: 'WARM-UP 😊', sub: '4 questions · 7 minutes' },
  { type: 'round-questions', round: '1', questions: [
    {n:1,t:"What is the full name of the University of San Francisco's Mascot Character?", correct:"Don Francisco"},
    {n:2,t:"How many majors are in the School of Management?", correct:"8"},
    {n:3,t:"Who was the lead performer of the Super Bowl Halftime Show this year?", correct:"Bad Bunny"},
    {n:4,t:"What is the boiling point of water in Fahrenheit?", correct:"212"}
  ], timer: 420 },
  { type: 'answers', round: '1', items: [{q:'Q1 — USF Mascot',a:'Don Francisco'},{q:'Q2 — Majors',a:'8 Majors'},{q:'Q3 — Halftime',a:'Bad Bunny'},{q:'Q4 — Boiling Point',a:'212°F'}] },
  { type: 'scoreboard', round: '1' },

  { type: 'round-intro', round: '2', theme: 'bap', title: 'ACCOUNTING 😬', sub: 'Presented by Beta Alpha Psi · 7 minutes' },
  { type: 'round-questions', round: '2', theme: 'bap', questions: [
    {n:1,t:"What is the basic accounting equation?", correct:"Assets = Liabilities + Equity", alternates:["Assets = Liability + Equity"], requirePlus:true},
    {n:2,t:"What is the name of the rules/principles generally accepted in accounting? (Acronyms allowed)", correct:"GAAP"},
    {n:3,t:"To increase cash, should there be a debit or credit journal entry?", correct:"Debit"},
    {n:4,t:"What is the journal entry for a depreciation expense?", type:'journal', correct:"DEBIT:Depreciation Expense | CREDIT:Accumulated Depreciation", note:'Enter Debit & Credit accounts'}
  ], timer: 420 },
  { type: 'answers', round: '2', theme: 'bap', items: [{q:'Q1 — Equation',a:'Assets = Liabilities + Equity (Liability also accepted)'},{q:'Q2 — Principles',a:'GAAP'},{q:'Q3 — Increase Cash',a:'Debit'},{q:'Q4 — Depreciation',a:'DR: Depreciation Expense | CR: Accumulated Depreciation'}] },
  { type: 'scoreboard', round: '2', theme: 'bap' },

  { type: 'round-intro', round: '3', theme: 'ai', title: 'THE AI ROUND 🤖', sub: 'Innovation & Technology · 7 minutes' },
  { type: 'round-questions', round: '3', theme: 'ai', questions: [
    {n:1,t:"What does NVIDIA make?", correct:"Semiconductor Chips / GPUs"},
    {n:2,t:"What year was the term 'Artificial Intelligence' first coined?", type:'slider', slider:{min:1926,max:2026,target:1956,cutoff:20,maxMultiplier:1.5}, correct:"1956", note:'Slider: 1926–2026 · Closer = More Points · Exact = Max Score'},
    {n:3,t:"Who is the most AI-altered personality?", type:'mc', mcChoices:[{letter:'A',label:'Jake Paul'},{letter:'B',label:'Taylor Swift'},{letter:'C',label:'Donald Trump'},{letter:'D',label:'Elon Musk'}], correct:"C: Donald Trump", note:'Select one option'},
    {n:4,t:"Name 3 Machine Learning Techniques", type:'ml-list', correct:"Supervised | Unsupervised | Reinforcement | Neural Networks | Decision Trees | Random Forests | SVM | K-Means | CNN | RNN", note:'Enter 3 distinct techniques · 1=0.33× · 2=0.66× · 3=1.0×'}
  ], timer: 420 },
  { type: 'answers', round: '3', theme: 'ai', items: [{q:'Q1 — NVIDIA',a:'Semiconductor Chips / GPUs'},{q:'Q2 — AI Coined',a:'1956 — John McCarthy'},{q:'Q3 — Most AI-altered',a:'C: Donald Trump'},{q:'Q4 — ML Techniques',a:'Supervised · Unsupervised · Reinforcement · Neural Networks · etc.'}] },
  { type: 'scoreboard', round: '3', theme: 'ai' },

  { type: 'round-intro', round: '4', title: 'MUSIC ROUND 🎵', sub: '4 questions · 7 minutes' },
  { type: 'round-questions', round: '4', questions: [
    {n:1,t:`Complete the lyric: "I'm the one that makes you laugh when you know ___ ___ _____ __ ___?"`, type:'text', correct:"you're 'bout to cry", note:'AUDIO STOPS AT THE BLANK — TEAMS FILL IN THE REST'},
    {n:2,t:"🎵 Name This Song! SONG NAME + ARTIST", type:'song-artist', correct:"Pocketful of Sunshine · Natasha Bedingfield", note:'Enter Song & Artist · 1 correct = 0.5× · 2 correct = 1.0×'},
    {n:3,t:"Who was the first artist to have over 30 songs with over 1 billion streams on Spotify?", correct:"The Weeknd"},
    {n:4,t:"What song held the #1 position on the Billboard Top 100 for a record-breaking 19 weeks in 2019? BONUS: NAME BOTH ARTISTS", type:'song-triple', correct:"Old Town Road | Lil Nas X | Billy Ray Cyrus", note:'Song = full pts · +Main = +3 pts · +Feat = +2 pts'}
  ], timer: 420, isAudioRound: true },
  { type: 'answers', round: '4', items: [{q:'Q1 — Lyric',a:`"you're 'bout to cry"`},{q:'Q2 — Song & Artist',a:'Pocketful of Sunshine · Natasha Bedingfield'},{q:'Q3 — Spotify Record',a:'The Weeknd'},{q:'Q4 — Billboard 19 Weeks',a:'Old Town Road · Lil Nas X ft. Billy Ray Cyrus'}] },
  { type: 'scoreboard', round: '4' },

  { type: 'round-intro', round: '5', title: 'SAN FRANCISCO 🌉', sub: '4 questions · 7 minutes' },
  { type: 'round-questions', round: '5', questions: [
    {n:1,t:"How many hills are in the city of San Francisco?", type:'slider', slider:{min:20,max:60,target:34,cutoff:7,maxMultiplier:1.5}, correct:"34", note:'Slider: 20–60 · Exact = 1.5× · Off by 7+ = 0 pts'},
    {n:2,t:"Who has a famous house on Haight and Ashbury? BONUS: GET BOTH ANSWERS", type:'dual-answer', correct:"Jimi Hendrix · Hells Angels", note:'1 correct = 1.0× · 2 correct = 1.5×'},
    {n:3,t:"What famous cookie was invented in San Francisco?", correct:"Fortune Cookie"},
    {n:4,t:"Who was the infamous San Francisco animal/resident that died December 2nd, 2025?", correct:"Claude the Albino Alligator"}
  ], timer: 420 },
  { type: 'answers', round: '5', items: [{q:'Q1 — SF Hills',a:'34 Hills'},{q:'Q2 — Haight & Ashbury',a:'Jimi Hendrix · Hells Angels'},{q:'Q3 — Famous Cookie',a:'Fortune Cookie'},{q:'Q4 — SF Resident',a:'Claude the Albino Alligator 🐊'}] },
  { type: 'scoreboard', round: '5' },

  { type: 'round-intro', round: '6', theme: 'wib', title: 'WOMEN IN BUSINESS 👩‍', sub: 'Celebrating Leadership · 7 minutes' },
  { type: 'round-questions', round: '6', theme: 'wib', questions: [
    {n:1,t:"Who was the first woman self-made billionaire? (2003)", correct:"Oprah Winfrey"},
    {n:2,t:"Who was the first woman to become CEO of a Fortune 500 company? (Washington Post)", correct:"Katherine Graham"},
    {n:3,t:"Who was the first woman self-made millionaire? (early 1900s)", correct:"Madam C.J. Walker"},
    {n:4,t:"What country has the highest percentage of women in Parliament?", correct:"Rwanda"}
  ], timer: 420 },
  { type: 'answers', round: '6', theme: 'wib', items: [{q:'Q1 — First Billionaire',a:'Oprah Winfrey'},{q:'Q2 — Fortune 500 CEO',a:'Katherine Graham'},{q:'Q3 — First Millionaire',a:'Madam C.J. Walker'},{q:'Q4 — Women in Parliament',a:'Rwanda — 64%'}] },
  { type: 'scoreboard', round: '6', theme: 'wib' },

  { type: 'round-intro', round: '7', title: 'MOVIES 🎬', sub: '4 questions · 7 minutes' },
  { type: 'round-questions', round: '7', questions: [
    {n:1,t:"In The Hunger Games, what is the name of the leading character from District 12?", correct:"Katniss Everdeen"},
    {n:2,t:"What is the name of the actor that plays Iron Man?", correct:"Robert Downey Jr."},
    {n:3,t:"What is the most watched movie during the Christmas season?", correct:"Home Alone"},
    {n:4,t:"How many Star Wars films are there?", correct:"11"}
  ], timer: 420 },
  { type: 'answers', round: '7', items: [{q:'Q1 — Hunger Games',a:'Katniss Everdeen'},{q:'Q2 — Iron Man',a:'Robert Downey Jr.'},{q:'Q3 — Christmas Movie',a:'Home Alone'},{q:'Q4 — Star Wars',a:'11'}] },
  { type: 'scoreboard', round: '7' },

  { type: 'bonus-intro', title: '★ BONUS ROUND', sub: '1-20 Confidence · +Pts Correct / -Pts Wrong · 1 min per question' },
  { type: 'bonus-q', round: 'bonus', q: 1, text: 'This company dominated mobile phones in the early 2000s but failed to anticipate smartphones. Its CEO said "The iPhone is just a niche product." Name the company.', timer: 60, correct:"Nokia" },
  { type: 'scoreboard', round: 'bonus' },
  { type: 'bonus-q', round: 'bonus', q: 2, text: 'What is the only letter of the alphabet that does NOT appear on the periodic table of elements?', timer: 60, correct:"J" },
  { type: 'scoreboard', round: 'bonus' },
  { type: 'bonus-q', round: 'bonus', q: 3, text: 'What is the smallest country in the world by land area?', timer: 60, correct:"Vatican City" },
  { type: 'scoreboard', round: 'bonus' },
  { type: 'bonus-q', round: 'bonus', q: 4, text: 'What country consumes the most chocolate per capita?', timer: 60, correct:"Switzerland" },
  { type: 'scoreboard', round: 'bonus' },
  { type: 'winner', title: "🏆 Tonight's Champion", sub: 'Congratulations to all teams!' }
];

const Host = {
  idx: 0, timer: null, timeLeft: 0, audio1: null, audio2: null, scoresReset: false,

  init() {
    this.audio1 = new Audio("audio/lyric-clip.mp3");
    this.audio2 = new Audio("audio/pocketful-of-sunshine.mp3");
    console.log('Audio1 src:', this.audio1.src);
    console.log('Audio2 src:', this.audio2.src);
    this.render();
    this.setupListeners();
    this.pushState();
  },

  render() {
    const s = SLIDES[this.idx];
    const el = document.getElementById('slideContent');
    const container = document.querySelector('.slide-container');
    const logo = document.getElementById('logoWatermark');
    
    container.className = container.className.replace(/theme-\w+/g, '').trim() + ' slide-container';
    if(s.theme) container.classList.add(`theme-${s.theme}`);
    logo.style.display = s.theme ? 'block' : 'none';

    const ind = document.getElementById('slideInd');
    const timerEl = document.getElementById('timerDisplay');
    const ab1 = document.getElementById('audioBtn1');
    const ab2 = document.getElementById('audioBtn2');

    ind.textContent = `${this.idx + 1} / ${SLIDES.length}`;
    timerEl.textContent = '--:--';
    timerEl.classList.remove('urgent');
    ab1.classList.remove('visible'); ab2.classList.remove('visible');

    if(s.type === 'title') el.innerHTML = `<h1 class="slide-title">${s.title}</h1><p class="slide-sub">${s.sub}</p>`;
    else if(s.type === 'rules') el.innerHTML = `<h1 class="slide-title">${s.title}</h1><div class="slide-content" style="text-align:left;display:flex;flex-direction:column;gap:16px">${s.items.map(i=>`<div style="font-size:22px">${i}</div>`).join('')}</div>`;
    else if(s.type === 'round-intro') el.innerHTML = `<p class="slide-sub">Round ${s.round}</p><h1 class="slide-title">${s.title}</h1><p class="slide-sub">${s.sub}</p>`;
    else if(s.type === 'round-questions') {
      let html = `<p class="slide-sub">Round ${s.round} · ${Math.floor(s.timer/60)}:00</p><h1 class="slide-title">📝 ANSWER ALL 4</h1><div class="q-grid">${s.questions.map(q=>`<div class="q-card"><div class="num">Q${q.n}</div><div class="txt">${q.t}</div>${q.note?`<div class="slide-note" style="font-size:10px;margin-top:6px">${q.note}</div>`:''}</div>`).join('')}</div>`;
      if(s.isAudioRound) { ab1.classList.add('visible'); ab2.classList.add('visible'); }
      el.innerHTML = html;
    }
    else if(s.type === 'answers') el.innerHTML = `<p class="slide-sub">Round ${s.round} · Answers</p><h1 class="slide-title">✅ ROUND ANSWERS</h1><div class="answers-grid">${s.items.map(i=>`<div class="answer-card"><div class="q">${i.q}</div><div class="a">${i.a}</div></div>`).join('')}</div>`;
    else if(s.type === 'scoreboard') el.innerHTML = `<p class="slide-sub">Round ${s.round}</p><h1 class="slide-title">🏆 LIVE SCORES</h1><p class="slide-sub">Check your devices for rankings</p>`;
    else if(s.type === 'bonus-intro') el.innerHTML = `<h1 class="slide-title">${s.title}</h1><p class="slide-sub">${s.sub}</p>`;
    else if(s.type === 'bonus-q') el.innerHTML = `<p class="slide-sub">Bonus Round · Question ${s.q} of 4</p><h1 class="slide-title" style="font-size:clamp(24px,4vw,40px)">${s.text}</h1><p class="slide-note" style="background:rgba(240,192,64,.15);color:var(--accent)">Choose confidence 1-20 · +Correct / -Wrong</p>`;
    else if(s.type === 'winner') el.innerHTML = `<h1 class="slide-title">${s.title}</h1><p class="slide-sub">${s.sub}</p>`;

    document.getElementById('prevBtn').disabled = this.idx === 0;
    document.getElementById('nextBtn').disabled = this.idx === SLIDES.length - 1;
  },

  next() { if(this.idx < SLIDES.length-1){this.idx++;this.change();} },
  prev() { if(this.idx > 0){this.idx--;this.change();} },

  async change() {
    clearInterval(this.timer); this.timer = null;
    if(this.audio1) this.audio1.pause();
    if(this.audio2) this.audio2.pause();

    const s = SLIDES[this.idx];
    if (s.round === '2' && s.type === 'round-intro' && !this.scoresReset) {
      this.resetScores();
    }
    if (s.type === 'scoreboard') {
      const prevSlide = SLIDES[this.idx - 1];
      const bonusQNum = (s.round === 'bonus' && prevSlide?.type === 'bonus-q') ? prevSlide.q : null;
      await this.calculateScores(s.round, bonusQNum);
    }

    this.render();
    await this.pushState();
    if(s.timer) this.startTimer(s.timer);
    if(s.type === 'scoreboard') this.renderScoreboard(s.round);
    if(s.type === 'winner') this.renderWinner();
  },

  async renderScoreboard(round) {
    const scoresSnap = await get(ref(db, 'trivia/scores'));
    const teams = [];
    scoresSnap.forEach(child => {
      const d = child.val();
      if (!d || !d.name) return;
      const total = Object.values(d.scores || {}).reduce((a, b) => a + (Number(b) || 0), 0);
      teams.push({ name: d.name, total });
    });
    teams.sort((a, b) => b.total - a.total);
    const medals = ['🥇','🥈','🥉'];
    const rows = teams.slice(0, 10).map((t, i) =>
      `<div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px 20px;margin-bottom:8px">
        <span style="font-size:clamp(14px,2vw,20px)">${medals[i] || (i+1)+'.'} ${t.name}</span>
        <span style="font-family:'Bebas Neue';font-size:clamp(22px,2.5vw,32px);color:var(--accent)">${t.total} pts</span>
      </div>`
    ).join('');
    document.getElementById('slideContent').innerHTML =
      `<p class="slide-sub">Round ${round}</p><h1 class="slide-title">🏆 LIVE SCORES</h1>
       <div style="max-width:580px;margin:0 auto;width:100%;text-align:left">${rows || '<p style="color:var(--muted);text-align:center">No scores yet</p>'}</div>`;
  },

  async calculateBonusQuestion(qnum, norm) {
    const bonusSlide = SLIDES.find(s => s.type === 'bonus-q' && s.q === qnum);
    if (!bonusSlide) return;
    try {
      const respSnap = await get(ref(db, 'trivia/responses'));
      const responsesByTeam = {};
      respSnap.forEach(child => {
        const r = child.val();
        if (r.round !== 'bonus' || r.qnum !== qnum || !r.answer) return;
        const tid = r.teamId;
        if (!responsesByTeam[tid]) responsesByTeam[tid] = [];
        responsesByTeam[tid].push(r);
      });
      const updates = {};
      for (const [tid, responses] of Object.entries(responsesByTeam)) {
        const latest = responses.sort((a, b) => b.submittedAt - a.submittedAt)[0];
        const conf = Math.max(1, Math.min(20, parseInt(latest.confidence) || 1));
        const isCorrect = norm(String(latest.answer)) === norm(bonusSlide.correct);
        updates[`trivia/scores/${tid}/scores/bonus_${qnum}`] = isCorrect ? conf : -conf;
      }
      if (Object.keys(updates).length > 0) {
        await update(ref(db), updates);
        console.log(`✅ Bonus Q${qnum} scored for ${Object.keys(responsesByTeam).length} teams`);
      }
    } catch(e) { console.error('Bonus score calc failed:', e); }
  },

  async renderWinner() {
    const scoresSnap = await get(ref(db, 'trivia/scores'));
    const teams = [];
    scoresSnap.forEach(child => {
      const d = child.val();
      if (!d || !d.name) return;
      const total = Object.values(d.scores || {}).reduce((a, b) => a + (Number(b) || 0), 0);
      teams.push({ name: d.name, total });
    });
    teams.sort((a, b) => b.total - a.total);
    const winner = teams[0];
    if (!winner) return;
    const medals = ['🥈','🥉','🏅'];
    const runnerUps = teams.slice(1, 4).map((t, i) =>
      `<div style="display:flex;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 20px;margin-bottom:6px">
        <span style="font-size:clamp(14px,2vw,20px)">${medals[i]} ${t.name}</span>
        <span style="font-family:'Bebas Neue';font-size:clamp(20px,2.5vw,30px);color:var(--accent)">${t.total} pts</span>
      </div>`
    ).join('');
    document.getElementById('slideContent').innerHTML =
      `<h1 class="slide-title">🏆 Tonight's Champion</h1>
       <p style="font-family:'Bebas Neue';font-size:clamp(28px,5vw,56px);color:var(--accent);margin:12px 0">${winner.name}</p>
       <p class="slide-sub">${winner.total} pts total</p>
       ${runnerUps ? `<div style="max-width:520px;margin:20px auto 0;text-align:left">${runnerUps}</div>` : ''}`;
  },

  async resetScores() {
    console.log('🔄 Resetting team scores for Round 2...');
    try {
      const snap = await get(ref(db, "trivia/scores"));
      if (!snap.exists()) return;
      const updates = {};
      snap.forEach(child => {
        updates[`${child.key}/scores`] = {};
        updates[`${child.key}/total`] = 0;
      });
      await update(ref(db, "trivia/scores"), updates);
      this.scoresReset = true;
      console.log('✅ Scores reset to 0');
    } catch (e) { console.error('Reset failed:', e); }
  },

  async calculateScores(round, bonusQNum = null) {
    if (!round) return;
    console.log(`🧮 Calculating scores for Round ${round}...`);
    const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '').trim();

    if (round === 'bonus') {
      if (!bonusQNum) return;
      await this.calculateBonusQuestion(bonusQNum, norm);
      return;
    }
    
    try {
      const [respSnap, scoresSnap] = await Promise.all([
        get(ref(db, 'trivia/responses')),
        get(ref(db, 'trivia/scores'))
      ]);

      // ✅ FIXED: Group responses by teamId instead of push ID
      const responsesByTeam = {};
      respSnap.forEach(child => {
        const r = child.val();
        if (r.round != round || !r.answers) return;
        const tid = r.teamId;
        if (!responsesByTeam[tid]) responsesByTeam[tid] = [];
        responsesByTeam[tid].push(r);
      });

      const roundSlide = SLIDES.find(s => s.type === 'round-questions' && s.round === round);
      if (!roundSlide) return;

      const updates = {};
      const teamTotals = {};

      // Initialize totals from existing scores
      scoresSnap.forEach(child => {
        teamTotals[child.key] = Object.values(child.val().scores || {}).reduce((a, b) => a + (Number(b) || 0), 0);
      });

      for (const [tid, rounds] of Object.entries(responsesByTeam)) {
        // Only use the latest submission for this round
        const latest = rounds.sort((a,b) => b.submittedAt - a.submittedAt)[0];
        let roundPts = 0;
        const ans = latest.answers;
        const conf = latest.confidence || {};

        roundSlide.questions.forEach(q => {
          const user = ans[q.n];
          if (!user) return;
          const c = conf[q.n] || 1;
          const correct = q.correct || '';

          if (q.type === 'text' || q.type === 'mc') {
            if (norm(user) === norm(correct)) roundPts += c;
          }
          else if (q.type === 'journal') {
            const uParts = user.split('|').map(p => norm(p.split(':')[1] || ''));
            const cParts = correct.split('|').map(p => norm(p.split(':')[1] || ''));
            let matches = 0;
            if (uParts[0] === cParts[0]) matches += 0.5;
            if (uParts[1] === cParts[1]) matches += 0.5;
            roundPts += c * matches;
          }
          else if (q.type === 'slider') {
            const sub = parseInt(user);
            if (isNaN(sub)) return;
            const dist = Math.abs(sub - q.slider.target);
            if (dist > q.slider.cutoff) return;
            const mult = q.slider.maxMultiplier * (1 - dist / q.slider.cutoff);
            roundPts += c * mult;
          }
          else if (q.type === 'ml-list') {
            const submitted = [...new Set(user.split('|').map(norm))];
            const correctList = correct.split('|').map(norm);
            const matches = submitted.filter(s => correctList.includes(s)).length;
            roundPts += c * Math.min(matches * 0.33, 1);
          }
          else if (q.type === 'song-artist') {
            const uParts = user.split('|').map(p => norm(p.split(':')[1] || ''));
            const cParts = correct.split('·').map(norm);
            let matches = 0;
            if (uParts[0] === cParts[0]) matches++;
            if (uParts[1] === cParts[1]) matches++;
            roundPts += c * (matches === 2 ? 1 : matches === 1 ? 0.5 : 0);
          }
          else if (q.type === 'song-triple') {
            const uParts = user.split('|').map(p => norm(p.split(':')[1] || ''));
            const cParts = correct.split('|').map(norm);
            if (uParts[0] !== cParts[0]) return;
            let pts = c;
            if (uParts[1] === cParts[1]) pts += 3;
            if (uParts[2] === cParts[2]) pts += 2;
            roundPts += pts;
          }
          else if (q.type === 'dual-answer') {
            const uParts = user.split('|').map(p => norm(p.split(':')[1] || ''));
            const cParts = correct.split('·').map(norm);
            let matches = 0;
            if (uParts.includes(cParts[0])) matches++;
            if (uParts.includes(cParts[1])) matches++;
            roundPts += c * (matches >= 2 ? 1.5 : matches === 1 ? 1 : 0);
          }
          else {
            // Default: basic text question (no type set)
            if (q.requirePlus && !String(user).includes('+')) return;
            const normUser = norm(String(user));
            const accepted = [norm(correct), ...(q.alternates || []).map(a => norm(a))];
            if (accepted.includes(normUser)) roundPts += c;
          }
        });

        updates[`trivia/scores/${tid}/scores/${round}`] = Math.round(roundPts);
        teamTotals[tid] = (teamTotals[tid] || 0) + Math.round(roundPts) - (Object.values(scoresSnap.child(tid)?.val()?.scores || {}).reduce((a,b)=>a+(Number(b)||0),0) || 0);
        updates[`trivia/scores/${tid}/total`] = Math.max(0, teamTotals[tid]);
      }

      if (Object.keys(updates).length > 0) {
        await update(ref(db), updates);
        console.log('✅ Leaderboard updated with', Object.keys(responsesByTeam).length, 'teams');
      } else {
        console.log('⚠️ No valid responses found for this round');
      }
    } catch (e) { console.error('Score calc failed:', e); }
  },

  startTimer(sec) {
    this.timeLeft = sec;
    const el = document.getElementById('timerDisplay');
    const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    el.textContent = fmt(this.timeLeft);
    this.timer = setInterval(() => {
      this.timeLeft--;
      el.textContent = fmt(this.timeLeft);
      update(gameRef, { timerSeconds: this.timeLeft });
      if(this.timeLeft <= 60) el.classList.add('urgent');
      if(this.timeLeft <= 0) { clearInterval(this.timer); this.timer = null; el.textContent = "TIME!"; }
    }, 1000);
  },

  playAudio(n) {
    const aud = n===1 ? this.audio1 : this.audio2;
    const btn = document.getElementById(n===1?'audioBtn1':'audioBtn2');
    if(!aud || !aud.src) { alert('Audio file not loaded.'); return; }
    aud.play()
      .then(() => { btn.innerHTML = "🔊 Playing..."; btn.disabled = true; update(gameRef, { audioPlaying: true, audioTrack: n }); })
      .catch(err => { console.error('Audio play failed:', err); btn.innerHTML = n===1 ? "▶ Q1 Lyric" : "▶ Q2 Song"; });
    aud.onended = () => { btn.innerHTML = n===1 ? "▶ Q1 Lyric" : "▶ Q2 Song"; btn.disabled = false; update(gameRef, { audioPlaying: false }); };
  },

  async reset() {
    if(confirm('⚠️ Reset entire game? All progress cleared.')) {
      clearInterval(this.timer); if(this.audio1) this.audio1.pause(); if(this.audio2) this.audio2.pause();
      await set(gameRef, { state: 'reset', updatedAt: Date.now() });
      setTimeout(()=>{this.idx=0;this.change();},1000);
    }
  },

  async pushState() {
    const s = SLIDES[this.idx];
    const payload = { state: s.type==='round-questions'?'round-active':s.type==='bonus-q'?'bonus-question':s.type, round:s.round||null, updatedAt:Date.now() };
    if(s.type==='round-questions') {
      payload.questions = s.questions; payload.timerSeconds = s.timer; payload.isAudioRound = !!s.isAudioRound;
    } else if(s.type==='bonus-q') {
      payload.qnum = s.q; payload.questionText = s.text; payload.timerSeconds = s.timer; payload.bonusMode = true;
    }
    await set(gameRef, payload);
  },

  setupListeners() {
    onValue(ref(db, ".info/connected"), snap => {
      const dot=document.getElementById('connDot'), txt=document.getElementById('connText');
      if(snap.val()){dot.classList.add('on');txt.textContent='LIVE';}else{dot.classList.remove('on');txt.textContent='OFFLINE';}
    });
    onValue(responsesRef, snap => {
      const s=SLIDES[this.idx]; if(!s || (s.type!=='round-questions' && s.type!=='bonus-q')) return;
      const count = Object.values(snap.val()||{}).filter(r => r.round===s.round && (s.type==='bonus-q' ? r.qnum===s.q : true)).length;
      document.getElementById('subCount').textContent = `Submitted (${count})`;
    });
  }
};

window.Host = Host; Host.init();
</script>
